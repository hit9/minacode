{# Site title and global navigation. #}
<h3 class="site-title"><a href="{{ pathto(root_doc)|e }}">{{ project|e }}</a></h3>
<iframe
  class="github-star"
  src="https://ghbtns.com/github-btn.html?user=hit9&amp;repo=nanocode&amp;type=star&amp;count=True&amp;size=large&amp;v=2"
  title="Star hit9/nanocode on GitHub"
  width="170"
  height="30"
  scrolling="0"
  frameborder="0"
></iframe>
<p class="doc-language">
{% if doc_language == 'zh_CN' %}
  <a href="https://nanocode.readthedocs.io/en/latest/{{ pagename }}.html">English</a>
{% else %}
  <a href="https://nanocode.readthedocs.io/zh/latest/{{ pagename }}.html">简体中文</a>
{% endif %}
</p>
{{ toctree(includehidden=theme_globaltoc_includehidden, collapse=theme_globaltoc_collapse, maxdepth=theme_globaltoc_maxdepth) }}
