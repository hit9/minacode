[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocode-cli"
version = "0.9.5"
description = "A small terminal coding agent written in Python"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "hit9", email = "hit9@icloud.com" },
]
keywords = ["ai", "coding-assistant", "cli", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
dependencies = [
    "anthropic>=0.64.0",
    "code-symbol-index>=0.3.5",
    "json-repair",
    "fastmcp-slim[client]>=3,<4",
    "openai>=2.37.0",
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    "socksio>=1.0.0",
    "websockets>=15.0.1",
]

[project.urls]
Homepage = "https://github.com/hit9/nanocode"
Repository = "https://github.com/hit9/nanocode"
Issues = "https://github.com/hit9/nanocode/issues"

[project.scripts]
nanocode = "nanocode:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[tool.setuptools]
py-modules = ["nanocode"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"
