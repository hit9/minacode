[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minacode"
version = "0.12.0"
description = "A small terminal coding agent written in Python"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "hit9", email = "hit9@icloud.com" },
]
keywords = ["ai", "coding-assistant", "cli", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development",
    "Topic :: Terminals",
]

dependencies = [
    "anthropic>=0.64.0",
    "code-symbol-index>=0.3.5",
    "json-repair",
    "fastmcp-slim[client]>=3,<4",
    "openai>=2.37.0",
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    "socksio>=1.0.0",
    "websockets>=15.0.1",
]

[project.urls]
Homepage = "https://github.com/hit9/minacode"
Repository = "https://github.com/hit9/minacode"
Issues = "https://github.com/hit9/minacode/issues"
Documentation = "https://minacode.readthedocs.io"

[project.scripts]
minacode = "minacode:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[tool.setuptools]
packages = ["minacode"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
# The package is a facade: submodules build one shared namespace via a star-import
# chain (base <- session <- skill <- mcp <- tools <- engine <- tui) and __init__.py
# re-exports it. base.py carries the whole import header, so many of its imports are
# only used by downstream modules through the star chain; star-import warnings and
# re-export "unused" imports are therefore expected rather than dead code.
per-file-ignores = { "minacode/*.py" = ["F403", "F405"], "minacode/__init__.py" = ["F401"], "minacode/base.py" = ["F401"] }
